# The whole twin, in one command.
#
#   ./setup.sh              once, after cloning: tools, .env files, secrets
#   docker compose up -d    every time after that
#   docker compose up --watch   same, and restarts/rebuilds a service when its source changes
#   docker compose down
#
# Seven services over one Postgres and one Redis. Before this file each
# repository stood up a server of its own and they collided by port - twice in
# one week, both times diagnosed at `make db-up` (see twin-engine/docs/ports.md).
# The servers are shared now; the schemas are not. Each repository keeps its own
# database on the one server, named in docker/postgres/initdb.d/10-databases.sql.
#
# `name:` is pinned rather than taken from this directory, because the network
# the four sibling compose files join is `${name}_default` and renaming the
# checkout would silently strand every one of them.
name: twin

# --------------------------------------------------------------------------
# Config
#
# Each repository keeps its own .env - that is what `make run` and `pnpm dev`
# read on the host, and duplicating those keys here would be a second copy to
# keep in agreement. `env_file` loads them; `environment` below pins the values
# that must differ inside a container, and wins over the file.
#
# The root .env holds only what compose itself needs *before* a container
# exists: values interpolated into a volume path, a published port, or a build
# argument. `./setup.sh` writes it. `.env.example` lists what goes in it.
# --------------------------------------------------------------------------

# twin-backend's repository, mounted so its source is editable, with the
# container's own install kept out of the host tree's way.
#
# One anonymous volume per workspace member, not just the root one: pnpm's
# isolated linker puts each member's dependency links in that member's own
# `node_modules`, so protecting only the root leaves every one of them shadowed
# by the bind mount and the backend crash-loops on ERR_MODULE_NOT_FOUND.
#
# A new workspace package needs a line here and a COPY in that repo's Dockerfile.
x-backend-volumes: &backend-volumes
  - ./twin-backend:/app
  # The container's install, not the host's: not interchangeable across platforms.
  - /app/node_modules
  - /app/apps/backend/node_modules
  - /app/packages/config/node_modules
  - /app/packages/connectors/node_modules
  - /app/packages/contracts/node_modules
  - /app/packages/core/node_modules
  - /app/packages/db/node_modules
  - /app/packages/engine/node_modules
  - /app/packages/queue/node_modules
  - /app/packages/telemetry/node_modules
  # The cached connector catalogue, which must survive a container restart:
  # rebuilding it needs the connectors service to be reachable.
  - twin-catalogue:/var/twin

services:
  # ------------------------------------------------------------------ data --

  # pgvector rather than stock postgres: twin-memory's first migration declares
  # `Vector(1536)` columns and fails on a server without the extension. The
  # other two databases never ask for it and pay nothing for its presence.
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin
      # The maintenance database only. The three that hold anything are created
      # by the init script below, which cannot run while connected to its own
      # target - so this has to be a fourth name, not one of theirs.
      POSTGRES_DB: twin
      # Makes comparisons deterministic regardless of the host's locale, which
      # is what twin-backend's integration suite asserts against.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5500}:5432'
    volumes:
      - twin-postgres-data:/var/lib/postgresql/data
      # Read-only, and read exactly once: the image runs this directory only
      # when the data directory is empty.
      - ./docker/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Every service below waits on this. Returning before the server accepts
      # queries would just move the failure into their first migration.
      test: ['CMD-SHELL', 'pg_isready -U twin -d twin']
      interval: 2s
      timeout: 3s
      retries: 30

  # Three tenants, one server, and their keys do not overlap: twin-backend's
  # BullMQ queues are `bull:*`, its delivery claims `twin:delivered:*`,
  # twin-connectors' rate limiter is `rate:*`, and twin-memory's event queue is
  # `twin:events`. All on database 0 deliberately - the backend *writes* the
  # list twin-memory *reads*, so they have to be on the same one.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Persistence on, which reverses the choice twin-backend's own compose made.
    # It was right there: that Redis held only rebuildable cache and queue
    # state, and keeping it across a database reset preserved jobs pointing at
    # rows that no longer existed. It is wrong here, because this Redis now also
    # holds `twin:events` - activity on its way into the memory store, with no
    # copy anywhere else until the consumer has taken it.
    #
    # The old failure mode is still real, so it moved rather than vanished:
    # resetting Postgres means flushing Redis in the same breath.
    #   docker compose down -v      (both, together, which is the safe order)
    #
    # But `-v` is every named volume, and that includes `twin-memory-store`:
    # the only copy of every account's memory, paid cards included. Back it up
    # first (twin-memory RUNBOOK.md, "Backup"), or remove just the two you mean:
    #   docker compose down && docker volume rm twin_twin-postgres-data twin_twin-redis-data
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # Loopback: nothing authenticates a Redis client, and the account an
      # event is filed under is whatever the message says.
      - '127.0.0.1:${REDIS_PORT:-6500}:6379'
    volumes:
      - twin-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # ------------------------------------------------------------------ apps --

  # The API, the ingest worker and the webhook receiver, in one process.
  backend:
    build: ./twin-backend
    # restart: unless-stopped
    command: ['node', 'apps/backend/src/index.ts']
    env_file: [./twin-backend/.env]
    environment:
      # Pinned, and not from .env: `API_PORT` is the *host* side of the mapping
      # below, so a .env that also set it would move what the app listens on
      # while the mapping still pointed at 8080, and nothing would answer.
      API_PORT: 8080
      DATABASE_URL: postgres://twin:twin@postgres:5432/twin_backend
      REDIS_URL: redis://redis:6379
      # The list twin-memory's consumer drains. Unset, the sink is not built at
      # all and every activity stops at this service's own database - which is
      # what happened before this file existed: the code has shipped since the
      # memory split, with nothing configured to turn it on.
      SINK_REDIS_URL: redis://redis:6379
      SINK_KEY: twin:events
      # Overridable because a provider that refuses a plaintext redirect uri
      # needs this to be an https tunnel for the duration of one connect.
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # Where a push is addressed. Only claude-code hands out a callback, and
      # its pushes come from `engine` on this network, where `localhost` is the
      # engine itself - so the service name, not BASE_URL.
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://backend:8080}
      # The one origin CORS allows and the origin on the event stream. The
      # frontend is in this file now, so this defaults to it rather than to the
      # backend's own /connected page. localhost and 127.0.0.1 are different
      # origins to a browser: this must match what you type in the address bar.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4000}
      # Service names, not host ports: everything this process dials is on this
      # network now. That is most of what got simpler - these two were
      # `host.docker.internal` round trips back out to published ports because
      # the four stacks could not see each other.
      CONNECTORS_URL: http://connectors:8090
      TWIN_ENGINE_URL: http://engine:8000
      # The last catalogue read, so a connectors outage at boot is a stale
      # provider list rather than an empty one. On a named volume, because a
      # container restart must not lose it.
      CATALOGUE_CACHE_PATH: /var/twin/catalogue.json
    ports:
      - '${API_PORT:-8080}:8080'
    volumes: *backend-volumes
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      # Started, not healthy: the catalogue read is retried and falls back to
      # the cache above, so a slow connectors must not hold the API down.
      connectors: { condition: service_started }
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('node:http').get({host:'127.0.0.1',port:8080,path:'/health'},
          r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # `docker compose watch` (via `docker compose watch` at the root), not
    # `node --watch`: this bind mount is virtiofs, which never emits the inotify
    # events `node --watch` needs. Compose watches from the host instead.
    develop:
      watch:
        - action: restart
          path: ./twin-backend/apps
        - action: restart
          path: ./twin-backend/packages
        # The install lives in the image's anonymous volumes, so a new
        # dependency needs the image rebuilt, not the process restarted.
        - action: rebuild
          path: ./twin-backend/pnpm-lock.yaml

  # Every provider's code, and no database at all. It publishes no host port:
  # the backend reaches it over this network and nothing else should reach it.
  #
  # There is deliberately no line here inheriting twin-backend's .env.
  # DATABASE_URL and CREDENTIAL_ENCRYPTION_KEY live there, and handing them to
  # this service would make compromising it as bad as compromising the backend,
  # which is the whole reason the two are separate (ADR 25).
  connectors:
    build: ./twin-connectors
    restart: unless-stopped
    env_file: [./twin-connectors/.env]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: redis://redis:6379
      PROVIDER_CONFIG_DIR: /app/config/providers
      CONNECTORS_PORT: 8090
      # The claude-code agent is the engine (twin-engine SANDBOX-PLAN phase 7),
      # reached where it publishes on the host: twin-connectors admits plain
      # http only to a loopback name, and `engine` is not one.
      CLAUDE_CODE_BASE_URL: ${CLAUDE_CODE_BASE_URL:-http://host.docker.internal:${TWIN_API_PORT:-8000}/claude-code}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      # Mounted rather than baked, so an edit needs a restart and not a rebuild.
      # node_modules stays the image's - the host's would shadow it.
      - ./twin-connectors/src:/app/src
      - ./twin-connectors/packages:/app/packages
      - ./twin-connectors/config:/app/config
      - /app/node_modules
      - /app/packages/config/node_modules
      - /app/packages/core/node_modules
      - /app/packages/ingest/node_modules
      - /app/packages/providers/node_modules
      - /app/packages/queue/node_modules
      - /app/packages/sdk/node_modules
      - /app/packages/telemetry/node_modules
    depends_on:
      redis: { condition: service_healthy }
    develop:
      watch:
        - action: restart
          path: ./twin-connectors/src
        - action: restart
          path: ./twin-connectors/packages
        - action: restart
          path: ./twin-connectors/config/providers
        - action: rebuild
          path: ./twin-connectors/pnpm-lock.yaml

  # Durable execution for the engine (twin-engine production runtime spec
  # 2026-09-23 §6.1): every chat is a workflow here and every turn an activity,
  # so a turn survives the process running it. The CLI's dev server with its
  # SQLite file on a volume - one container and no schema job, which is what a
  # laptop wants; a deployment points `TEMPORAL_ADDRESS` at a real cluster or
  # Temporal Cloud and nothing in the engine changes. The UI is loopback-only.
  temporal:
    image: temporalio/temporal:1.9.1
    restart: unless-stopped
    command:
      [
        'server', 'start-dev', '--ip', '0.0.0.0', '--headless=false',
        '--db-filename', '/home/temporal/temporal.db',
      ]
    ports:
      - '127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8233'
    # At the user's home and not a subdirectory: the image runs as `temporal`,
    # and a fresh named volume takes the ownership of the directory it mounts
    # over - a path the image does not have would be root's.
    volumes:
      - twin-temporal-data:/home/temporal
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', 'localhost:7233']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # The agent runtime. Its entrypoint creates the database if the server has
  # none and brings the schema to head before uvicorn serves anything, so
  # `twin_engine` needs nothing from the init script beyond existing.
  engine:
    build: ./twin-engine
    restart: unless-stopped
    # The engine's API: `python -m twin_relay`, not the dev harness it ran
    # until 2026-09-23. It runs no turns - each command signals the thread's
    # workflow in `temporal`, and `engine-worker` executes it - so it can be
    # restarted, or scaled, without costing anyone a turn.
    command: ['uv', 'run', 'python', '-m', 'twin_relay']
    env_file: [./twin-engine/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://twin:twin@postgres:5432/twin_engine
      # Inside its own network namespace, so all interfaces; the host port
      # below is what stays on loopback. Every route is admitted by the relay
      # secret alone (`twin_relay.guard.admitted`).
      TWIN_RELAY_HOST: 0.0.0.0
      TWIN_RELAY_PORT: '8000'
      TEMPORAL_ADDRESS: temporal:7233
      # The live view's stream, the Redis twin-backend reads it from.
      REDIS_URL: redis://redis:6379
      # Named for the connectors service and pointed at the backend, which is
      # correct and has always been confusing: what this dials is the backend's
      # connector-facing API on 8080, not twin-connectors on 8090.
      CONNECTORS_URL: http://backend:8080
      # Langfuse is not in this file - it is its own stack under infra/langfuse
      # - so it is still reached across the host. Docker Desktop resolves the
      # name by itself; a Linux engine does not, so set LANGFUSE_HOST there.
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://host.docker.internal:3000}
      # One root for every tenant: `<TWIN_ROOT>/<company>/<account>`. A string
      # and not a mount (twin-backend ADR 41): each workspace is a volume in
      # its account's own container, at this path, and this container has none
      # of them. The broker and the backend are handed the same string, since
      # a session's `cwd` crosses all three.
      TWIN_ROOT: ${TWIN_ROOT:?set TWIN_ROOT in the root .env - run ./setup.sh}
      # The other half of the same relationship, in the other direction: where
      # this person's history is read from. It is dialled by the *twin* and no
      # longer by the backend, which used to rank every prompt against it and
      # paste the answer into the turn - the twin holds memory tools now and
      # calls them when it decides the question needs history.
      #
      # Unset is a real state: the twin then answers out of its connectors and
      # its conversation, and binds no memory tools at all.
      MEMORY_URL: http://memory-api:8000
      # The broker below, on this network. Pinned here rather than read from
      # twin-engine/.env, which spells it for `make api` on the host.
      TWIN_SANDBOX_BROKER_URL: http://sandbox-broker:8766
      # Shared with `sandbox-broker`, so named once, in the root .env, and
      # minted there by ./setup.sh: a value in two files is two values.
      TWIN_SANDBOX_BROKER_TOKEN: ${TWIN_SANDBOX_BROKER_TOKEN:?run ./setup.sh - it mints TWIN_SANDBOX_BROKER_TOKEN}
      TWIN_SANDBOX_AUDIT_TOKEN: ${TWIN_SANDBOX_AUDIT_TOKEN:?run ./setup.sh - it mints TWIN_SANDBOX_AUDIT_TOKEN}
      # What the coding boxes' proxies present, and where this process fetches
      # an account's GitHub credential on their behalf (SANDBOX-PLAN phase 8).
      TWIN_BOX_PROXY_TOKEN: ${TWIN_BOX_PROXY_TOKEN:?run ./setup.sh - it mints TWIN_BOX_PROXY_TOKEN}
      TWIN_BACKEND_URL: http://backend:8080
    # Deliberately not a `depends_on`: a memory service that is down must cost
    # a lookup and not the engine's boot. Each lookup degrades to a sentence
    # saying memory was unreachable, which the model can act on.
    #
    # No `extra_hosts` and no volumes, the `~/.twin-relay` mount included: the
    # relay secret arrives as TWIN_RELAY_SECRET from twin-engine/.env, where
    # ./setup.sh copies it. All three were a turn's reach while `execute` ran
    # in here (twin-engine SANDBOX-PLAN F2, F4, F5), and nothing does now.
    # 127.0.0.1: nothing but the backend, on this network, has reason to call
    # the engine, and the host port is for curl on a laptop.
    ports:
      - '127.0.0.1:${TWIN_API_PORT:-8000}:8000'
    healthcheck:
      test: ['CMD', '/app/.venv/bin/python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      temporal: { condition: service_healthy }
    # No bind mount - the source is baked into the image - so compose copies an
    # edit in and restarts. The project is an editable install over /app/src,
    # and the restart re-runs the entrypoint, so a new migration is applied too.
    develop:
      watch:
        - action: sync+restart
          path: ./twin-engine/src
          target: /app/src
          ignore: ['**/__pycache__/']
        - action: sync+restart
          path: ./twin-engine/prompts
          target: /app/prompts
        - action: sync+restart
          path: ./twin-engine/migrations
          target: /app/migrations
          ignore: ['**/__pycache__/']
        - action: rebuild
          path: ./twin-engine/pyproject.toml
        - action: rebuild
          path: ./twin-engine/uv.lock

  # The sandbox broker: the one process that may hold the Docker socket, so the
  # only one that can create a tenant container (twin-engine SANDBOX-PLAN).
  # The engine reaches it here, never the socket.
  #
  # The engine's image as a different process, and deliberately not its
  # environment: no `env_file`, so the model key, the database url and the
  # relay secret are not in this container at all.
  sandbox-broker:
    build: ./twin-engine
    restart: unless-stopped
    # The image's entrypoint provisions a database this process never opens.
    entrypoint: []
    command: ['uv', 'run', 'python', '-m', 'twin_sandbox']
    # Root, and honestly: anything that can reach the socket is root on the
    # host already, and the image's own user cannot open it.
    user: '0:0'
    environment:
      TWIN_SANDBOX_HOST: 0.0.0.0
      TWIN_SANDBOX_BROKER_TOKEN: ${TWIN_SANDBOX_BROKER_TOKEN:?run ./setup.sh - it mints TWIN_SANDBOX_BROKER_TOKEN}
      # Built by ./setup.sh (`make sandbox-image egress-image` in twin-engine).
      TWIN_SANDBOX_IMAGE: ${TWIN_SANDBOX_IMAGE:-twin-sandbox:dev}
      TWIN_EGRESS_IMAGE: ${TWIN_EGRESS_IMAGE:-twin-egress:dev}
      # The string a workspace path is built from, not a mount: the broker names
      # the path inside a tenant container where that account's volume goes.
      TWIN_ROOT: ${TWIN_ROOT:?set TWIN_ROOT in the root .env - run ./setup.sh}
      # The hosts a sandbox may reach - an account's own container and, since
      # SANDBOX-PLAN phase 8, its coding boxes, which go out through this proxy
      # too. twin-engine/docker-compose.yml has the reasoning for the first
      # six; the rest are the package hosts the boxes' Squid allowed. Add one
      # by reading what the proxy refused.
      TWIN_EGRESS_ALLOWLIST: ${TWIN_EGRESS_ALLOWLIST:-api.anthropic.com,platform.claude.com,.pypi.org,.pythonhosted.org,pypi.python.org,.npmjs.org,.npmjs.com,.yarnpkg.com,.github.com,.githubusercontent.com,nodejs.org,.astral.sh,.crates.io,proxy.golang.org,sum.golang.org,deb.debian.org}
      # What a coding box calls by name, joined to its account's network when
      # the code worker opens it (phase 8).
      TWIN_SANDBOX_BOX_SERVICES: llm-proxy,git-proxy,preview
      # What a coding box is made from. The broker makes every box since
      # SANDBOX-PLAN phase 8.3 (`twin_sandbox/box_policy.py`); the code worker
      # asks for one by project and holds no Docker at all. `make
      # sandbox-image` builds the image; TWIN_BOX_RUNTIME=runsc on a Linux
      # host with gVisor.
      TWIN_BOX_IMAGE: ${TWIN_BOX_IMAGE:-twin-box:dev}
      TWIN_BOX_LLM_URL: http://llm-proxy:8300
      TWIN_BOX_RUNTIME: ${TWIN_BOX_RUNTIME:-}
      TWIN_SANDBOX_AUDIT_URL: http://engine:8000
      TWIN_SANDBOX_AUDIT_TOKEN: ${TWIN_SANDBOX_AUDIT_TOKEN:?run ./setup.sh - it mints TWIN_SANDBOX_AUDIT_TOKEN}
      # Off 172.19/16 and off TWIN_SUBNET below; twin-engine/docs/ports.md is
      # the register.
      TWIN_SANDBOX_NETWORK_POOL: ${TWIN_SANDBOX_NETWORK_POOL:-10.204.0.0/16}
      TWIN_EGRESS_SUBNET: ${TWIN_EGRESS_SUBNET:-10.203.0.0/24}
    volumes:
      # Here and nowhere else. `engine` must never grow this line.
      - /var/run/docker.sock:/var/run/docker.sock

  # The worker: `python -m twin_workflows`, which executes every turn. Scale it
  # with `docker compose up --scale engine-worker=N`; Temporal hands each chat
  # to one worker at a time, and a turn whose worker dies is resumed by another
  # from its checkpoint.
  engine-worker:
    build: ./twin-engine
    restart: unless-stopped
    command: ['uv', 'run', 'python', '-m', 'twin_workflows']
    # The worker gives running turns `DRAIN` (30s) to finish on SIGTERM, then
    # leaves the rest RUNNING for the next worker - so this has to be longer.
    stop_grace_period: 45s
    env_file: [./twin-engine/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://twin:twin@postgres:5432/twin_engine
      CONNECTORS_URL: http://backend:8080
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://host.docker.internal:3000}
      TWIN_ROOT: ${TWIN_ROOT:?set TWIN_ROOT in the root .env - run ./setup.sh}
      MEMORY_URL: http://memory-api:8000
      TEMPORAL_ADDRESS: temporal:7233
      REDIS_URL: redis://redis:6379
      # The twin's task tools call the engine's API from inside a turn: the
      # routes that start and steer a coding task are there, not here.
      TWIN_ENGINE_URL: http://engine:8000
      # A turn's files and shell are the account's own container, and this is
      # where turns run, so this is what reaches the broker for them.
      TWIN_SANDBOX_BROKER_URL: http://sandbox-broker:8766
      TWIN_SANDBOX_BROKER_TOKEN: ${TWIN_SANDBOX_BROKER_TOKEN:?run ./setup.sh - it mints TWIN_SANDBOX_BROKER_TOKEN}
    # No `extra_hosts` and no volumes, as on `engine`, and here most of all:
    # this is the process that runs turns, so it is the one `execute` would
    # have reached them from (twin-engine SANDBOX-PLAN F2, F4, F5). The relay
    # secret keys the Temporal payload codec - a worker holding a different
    # one could not read a single turn - and arrives as TWIN_RELAY_SECRET from
    # twin-engine/.env, since the image's user is not root and would not find
    # a mount at /root/.twin-relay.
    # After the engine, whose entrypoint migrates the schema: two containers
    # migrating one database at once is a race neither should run.
    depends_on:
      engine: { condition: service_healthy }
    develop:
      watch:
        - action: sync+restart
          path: ./twin-engine/src
          target: /app/src
          ignore: ['**/__pycache__/']
        - action: sync+restart
          path: ./twin-engine/prompts
          target: /app/prompts
        - action: rebuild
          path: ./twin-engine/uv.lock

  # Coding tasks (twin-engine production runtime spec §6.2-6.3). A task runs
  # dsh in a box of its own - a container from `twin-box:dev`, which
  # `make sandbox-image` builds in twin-engine - and these are the box's world:
  # the worker that drives it and the three services it calls by name. The
  # sandbox broker makes the box, on its account's own network, joins those
  # services to it, and sends it out through the egress proxy like the
  # account's own container (SANDBOX-PLAN phase 8). There is no network all
  # boxes share.
  #
  # `python -m twin_code`: runs `CodeTaskWorkflow` and every activity that
  # touches a box. It reaches no Docker: it asks the broker for a box by
  # project, runs commands in it and streams its agent through the broker's
  # box routes (phase 8.3), where `docker-proxy` used to hand it the Docker
  # API with nothing but an endpoint filter in the way.
  code-worker:
    build: ./twin-engine
    restart: unless-stopped
    command: ['uv', 'run', 'python', '-m', 'twin_code']
    stop_grace_period: 30s
    env_file: [./twin-engine/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://twin:twin@postgres:5432/twin_engine
      TEMPORAL_ADDRESS: temporal:7233
      REDIS_URL: redis://redis:6379
      # What the task card links to: the gateway below, on the host port it is
      # published on. The box id in it is the capability.
      TWIN_PREVIEW_URL: http://{box}.{port}.preview.localhost:${TWIN_PREVIEW_PORT:-47620}
      # A repo box's `origin`, and where the worker asks for the account's
      # GitHub credential to open its draft pull request.
      TWIN_GIT_PROXY_URL: http://git-proxy:8400
      TWIN_BACKEND_URL: http://backend:8080
      # Where every box comes from, and every command run in one goes through.
      TWIN_SANDBOX_BROKER_URL: http://sandbox-broker:8766
      TWIN_SANDBOX_BROKER_TOKEN: ${TWIN_SANDBOX_BROKER_TOKEN:?run ./setup.sh - it mints TWIN_SANDBOX_BROKER_TOKEN}
    # The relay secret - the codec's key, and what box tokens are minted under -
    # is TWIN_RELAY_SECRET from twin-engine/.env, as on `engine-worker`.
    depends_on:
      engine: { condition: service_healthy }
    develop:
      watch:
        - action: sync+restart
          path: ./twin-engine/src
          target: /app/src
          ignore: ['**/__pycache__/']

  # Where a box's model calls go: `DEEPSEEK_BASE_URL` in every box. It checks
  # the box's token, charges the project's live task, refuses past the task's
  # ceiling, and forwards to OpenRouter with the one real key - which is here
  # and in no box.
  llm-proxy:
    build: ./twin-engine
    restart: unless-stopped
    # The image's entrypoint provisions a database this process never opens.
    entrypoint: []
    command: ['uv', 'run', 'python', '-m', 'twin_code.llm_proxy']
    # No `env_file`, and that is the point (twin-engine SANDBOX-PLAN phase 8): a
    # box can open a socket to this, so it holds the model key and the engine's
    # box bearer and nothing else - no database, no relay secret, no broker
    # token. What it needs to know about a box it asks the engine.
    environment:
      OPENROUTER_KEY: ${OPENROUTER_KEY:?run ./setup.sh - it copies OPENROUTER_KEY here from twin-engine/.env}
      TWIN_BOX_PROXY_TOKEN: ${TWIN_BOX_PROXY_TOKEN:?run ./setup.sh - it mints TWIN_BOX_PROXY_TOKEN}
      TWIN_ENGINE_URL: http://engine:8000
    # On the project network only: the broker joins it to each account's
    # network that has a box on it, under this service's name.
    depends_on:
      engine: { condition: service_healthy }

  # A repo box's `origin`: its own repository only, its own task's branch only,
  # with the account's GitHub credential put on here and never in the box.
  git-proxy:
    build: ./twin-engine
    restart: unless-stopped
    entrypoint: []
    command: ['uv', 'run', 'python', '-m', 'twin_code.git_proxy']
    # The engine's box bearer and nothing else, as on `llm-proxy`: the engine
    # checks the box's token and fetches the account's GitHub credential.
    environment:
      TWIN_BOX_PROXY_TOKEN: ${TWIN_BOX_PROXY_TOKEN:?run ./setup.sh - it mints TWIN_BOX_PROXY_TOKEN}
      TWIN_ENGINE_URL: http://engine:8000
    # On the project network only: the broker joins it to each account's
    # network that has a box on it, under this service's name.
    depends_on:
      engine: { condition: service_healthy }

  # The preview gateway: `http://<box>.<port>.preview.localhost:47620` is what
  # box <box> serves on <port>. Published on loopback; `*.localhost` resolves
  # there in every browser, so it needs no DNS. The broker joins it to each
  # account's network that has a box on it, which is how it reaches the box.
  preview:
    image: caddy:2.11.4
    restart: unless-stopped
    volumes:
      - ./twin-engine/sandbox/preview/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - '127.0.0.1:${TWIN_PREVIEW_PORT:-47620}:80'

  frontend:
    build:
      context: ./twin-frontend
      args:
        # `next build` inlines this into the client bundle, so it cannot arrive
        # at runtime the way the urls below do - changing it needs a rebuild.
        # Publishable by design, so an image layer holding it gives nothing away.
        # It has to be interpolated from the root .env rather than read from
        # .env.local, because `env_file` feeds a container and not a build.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set it in the root .env - run ./setup.sh}
    restart: unless-stopped
    env_file: [./twin-frontend/.env.local]
    environment:
      NODE_ENV: production
      TWIN_ENV: ${TWIN_ENV:-dev}
      # Fixed, like the backend's: a container has its own namespace, so only
      # the host side varies and `frontend:4000` then means one thing.
      PORT: 4000
      # Pinned: .env.local holds the localhost url `next dev` needs on the host,
      # and inside this container localhost is this container.
      TWIN_API_URL: http://backend:8080
      # TWIN_PUBLIC_URL is deliberately NOT pinned. It is this app's own public
      # origin - the browser's view - so it is the same string on the host and
      # in here, and .env.local is its one copy. Pinning it with a default of
      # :8080 is what broke Connect: the frontend sends `<origin>/connections`
      # as `returnTo`, and the backend refuses any origin that is not
      # FRONTEND_URL's. Move this and the backend's FRONTEND_URL together.
      # The server half reads the publishable key too, so it is here as well as
      # in the build args above. The secret key comes from .env.local and is
      # never a build arg, which would leave it in an image layer.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?}
    ports:
      - '${FRONTEND_PORT:-4000}:4000'
    # A bare `/` answers a redirect to /sign-in with no session, which is the
    # correct response and a fine liveness signal.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('node:http').get({host:'127.0.0.1',port:4000},
          r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      backend: { condition: service_started }
    # A production `next build`, so there is no dev server to hot-reload: every
    # change is a rebuild of the image, which takes a minute, not a second. For
    # instant HMR run `pnpm dev` on the host instead.
    develop:
      watch:
        - action: rebuild
          path: ./twin-frontend
          ignore:
            - node_modules/
            - .next/
            - .git/
            - tests/
            - docs/
            - test-results/
            - playwright-report/
            - coverage/
            - '**/*.md'

  # ---------------------------------------------------------------- memory --
  #
  # Two processes over one store, which is a directory of files plus a SQLite
  # index rebuildable from them. They are split because they fail differently:
  # the consumer falling behind is a queue that drains later, the API being down
  # is every turn losing its recall.

  # The write half: drains `twin:events` into the store, forever.
  memory-consumer:
    build: ./twin-memory
    restart: unless-stopped
    # An init as PID 1, so SIGTERM reaches Python as a signal it handles: the
    # batch in hand finishes and is acknowledged, then the process exits. The
    # grace period is that batch plus a fold; past it the kill is still safe,
    # because an unacknowledged batch is requeued on the next start.
    init: true
    stop_grace_period: 60s
    # `--card-every 10` turns on the one paid stage on the write path: every
    # tenth batch, and again whenever the queue goes quiet, threads that have
    # settled are carded. Without it a live store accumulates threads no card
    # has ever read, and the facts lane - which is what retrieval actually
    # ranks over - stays empty until somebody runs `store card` by hand.
    #
    # `settled_only` is what makes the rhythm affordable rather than reckless:
    # a conversation arriving over six batches is one call once it goes quiet,
    # not six as it grows. Set it to 0 to go back to never spending here.
    command:
      ['python', '-m', 'consumer', '/var/twin/store', '--card-every', '${MEMORY_CARD_EVERY:-10}']
    env_file: [./twin-memory/.env]
    environment:
      # Database 0 explicitly, and the same one the backend's sink writes to.
      REDIS_URL: redis://redis:6379/0
      # `none` is lexical-only retrieval and needs no model. The alternative
      # pulls sentence-transformers - hundreds of megabytes into the image, and
      # the mlx backend the Makefile mentions is Apple-silicon-only and cannot
      # run in this Linux container at all.
      TWIN_EMBEDDER: ${TWIN_EMBEDDER:-none}
      # What the card rhythm may spend in a UTC day, tracked in Redis so a
      # restart does not reset it. Unset is no ceiling.
      MEMORY_DAILY_BUDGET_USD: ${MEMORY_DAILY_BUDGET_USD:-5}
      # The reply cache is for benchmark re-runs. A live twin must not be
      # handed yesterday's card for today's thread, and the cache would grow in
      # this container's writable layer until it was recreated.
      LLM_CACHE: 'off'
    volumes:
      - twin-memory-store:/var/twin/store
    depends_on:
      redis: { condition: service_healthy }
    # Alive means it said so within the last minute: `QueueFeed.beat` sets the
    # key with a 60s expiry on every pass, busy or idle. A wedged loop stops
    # beating while the process stays up, which no process check would see.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import sys; from consumer.queue import HEARTBEAT, connect;
          sys.exit(0 if connect(timeout=3).exists(HEARTBEAT) else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    # Source is baked, not mounted: compose copies an edit in and restarts.
    # `consumer` and `twin_db` are found through PYTHONPATH=/app/src, so a
    # synced file is what runs without reinstalling anything.
    develop:
      watch: &memory-watch
        - action: sync+restart
          path: ./twin-memory/src
          target: /app/src
          ignore: ['**/__pycache__/']
        - action: rebuild
          path: ./twin-memory/pyproject.toml
        - action: rebuild
          path: ./twin-memory/uv.lock

  # The read half: what the twin's `memory_*` tools dial, one lookup at a time.
  #
  # 127.0.0.1 for the same reason the engine is: nothing here authenticates a
  # caller, so the only safe audience is this machine.
  memory-api:
    build: ./twin-memory
    restart: unless-stopped
    command: ['python', '-m', 'api']
    env_file: [./twin-memory/.env]
    environment:
      TWIN_STORE: /var/twin/store
      # The same queue the consumer drains, and the only reason this service
      # needs one: `/memory/unfiled` reports what has arrived and is not filed
      # yet, which is the twin's way of telling "memory does not have this"
      # apart from "memory has not read it yet". Unset, `consumer.queue.connect`
      # falls back to localhost - which inside this container is this container
      # - so that route answered `available: false` on every call and the twin
      # was told the queue was down when it was two containers away and healthy.
      REDIS_URL: redis://redis:6379/0
      # 0.0.0.0 is this container's own namespace, not the host's network:
      # inside here loopback is this container, so nothing would reach the
      # published port without it.
      TWIN_HOST: 0.0.0.0
      TWIN_PORT: 8000
      TWIN_EMBEDDER: ${TWIN_EMBEDDER:-none}
      # A request that names no account is a 400, not an answer from the shared
      # default store. The default store answering was how every twin read an
      # empty memory while the consumer filed each account's events under its
      # own id. MEMORY_API_SECRET comes from twin-memory/.env (setup.sh mints it).
      TWIN_REQUIRE_ACCOUNT: '1'
    ports:
      - '127.0.0.1:${MEMORY_API_PORT:-8200}:8000'
    depends_on:
      # Started, not healthy, and not required: a Redis that is down costs this
      # service one route - `/memory/unfiled` says so and answers - where the
      # store on disk answers everything else.
      redis: { condition: service_started }
    volumes:
      # The same store the consumer writes. One SQLite writer and one reader over
      # one index: a query sees every batch the consumer has committed, with no
      # restart, because the reader's open connection reads committed state. A
      # batch still in flight is the only thing it cannot see yet.
      - twin-memory-store:/var/twin/store
    develop:
      watch: *memory-watch
    healthcheck:
      # `/health` opens the store and answers with its root, which is what this
      # service being up actually means. It used to ask for `/openapi.json`,
      # because there was no health route - that answered from the framework
      # and would have kept answering with the store shut.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',
          timeout=3).status < 500 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ---------------------------------------------------------------- tunnel --
  #
  # A public url for the one direction nothing else provides: a provider
  # dialling us. Every other call in this system is outbound, which is why
  # BASE_URL could stay loopback until a connector declared `mode: webhook`.
  #
  # Both are off by default - they publish this machine to the internet, and
  # most work here never needs that. They front the backend, which is the only
  # service any provider dials, so they live here rather than in that repo.

  # A hostname you own, routed in Cloudflare to `http://backend:8080` on this
  # network. The name survives a restart, so BASE_URL can live in .env and no
  # provider's registered url needs re-entering.
  #
  #   docker compose --profile tunnel-named up -d
  tunnel-named:
    image: cloudflare/cloudflared:latest
    profiles: ['tunnel-named']
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      # QUIC binds a source address and never rebinds it, so a route change on a
      # multi-interface host wedges every UDP dial - `sendmsg: network is
      # unreachable` - and the tunnel serves 530 until restarted: four times in
      # ninety minutes once, always after a healthy registration. `auto` does
      # fall back to HTTP/2, but it chooses once at startup while QUIC still
      # works and never revisits that, so it picks QUIC on this host every time.
      # The registration line should read `protocol=http2`.
      - --protocol
      - http2
      - run
      - --token
      # Soft default on purpose: compose interpolates before it filters by
      # profile, so `:?` here would fail every ordinary `docker compose up` for
      # anyone without a token.
      - ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      backend: { condition: service_started }

  # No account and no hostname of your own. A quick tunnel is renamed on every
  # start, so each run needs BASE_URL moved and every provider's Request URL
  # re-registered by hand:
  #
  #   docker compose --profile tunnel up -d tunnel
  #   docker compose logs tunnel | grep -o 'https://.*trycloudflare.com'
  #   BASE_URL=<that> docker compose up -d --force-recreate backend
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ['tunnel']
    # Deliberately not restarted. Coming back on its own means a new hostname
    # that BASE_URL and the provider's registered url both point away from -
    # working in appearance and delivering nothing. Staying down is honest.
    restart: 'no'
    command: tunnel --no-autoupdate --url http://backend:8080
    depends_on:
      backend: { condition: service_started }

volumes:
  twin-postgres-data:
  twin-redis-data:
  # The cached connector catalogue, which must survive a container restart.
  twin-catalogue:
  # The memory store: the ledger is canonical and the index is rebuilt from it,
  # so losing this loses everything the twin remembers that is not still in
  # twin-backend's `events` table.
  twin-memory-store:
  # Temporal's history: every chat's queue, pending approval and timers.
  # Losing it loses what in-flight chats were waiting on, never their messages,
  # which are in the engine's database.
  twin-temporal-data:

# Pinned off 172.19/16, which is this office's LAN (172.19.2.0/23). Compose's
# default pick swallowed it once: every container routed 172.19.2.202 onto its
# own bridge and got EHOSTUNREACH. One subnet here now covers all seven.
networks:
  default:
    ipam:
      config:
        - subnet: ${TWIN_SUBNET:-10.201.0.0/16}
